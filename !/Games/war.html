            z-index: 999;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            border: 8px solid #333;
            border-radius: 7px;
            width: 500px;
            height: 250px;
            padding: 20px;
            box-sizing: border-box;
        }

        .won { background-color: var(--green); display: none; }
        .init { background-color: var(--red); }
        .hidden { display: none; }

        .floating {
            cursor: pointer;
            text-decoration: underline;
            margin-top: 20px;
            display: inline-block;
            animation: floating 1.5s infinite ease-in-out;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes getIn { from { background-size: 0%; } to { background-size: 70%; } }
        @keyframes getIn1 { from { background-size: 0%; } to { background-size: 70%; } }

        @media (max-width: 500px) {
            .game { width: 330px; height: 400px; }
            .box { width: 66px; height: 66px; }
            .won, .init { width: 90%; }
        }

<body>

    <div class="init">
        <h1>WE NEED YOU!</h1>
        <p>Click squares to plant trees. Hurry or the factories will colonize us!</p>
        <p class="floating bold start-trigger">START GAME</p>
    </div>

    <div class="won">
        <h1>YOU WON!</h1>
        <p class="floating replay bold">SAVE THE WORLD AGAIN</p>
    </div>

    <div class="container">
        <div class="game"></div>
    </div>

    <script>
        const gameContainer = document.querySelector('.game');
        const initScreen = document.querySelector('.init');
        const wonScreen = document.querySelector('.won');
        
        let arrFactory = [];
        let arrTree = [];
        let newFactory;
        let interval = 800;
        let boxes = [];

        function createGame() {
            for (let i = 0; i < 30; i++) {
                let b = document.createElement('div');
                b.classList.add('box');
                b.setAttribute('data-value', i);
                gameContainer.appendChild(b);
                b.addEventListener('click', addTree);
                b.addEventListener('click', fireBurst);
                boxes.push(b);
            }
        }

        function addTree(e) {
            let c = e.target;
            let val = c.dataset.value;

            if (!arrTree.includes(val)) {
                arrTree.push(val);
                
                if (arrFactory.includes(val)) {
                    arrFactory.splice(arrFactory.indexOf(val), 1);
                }

                c.classList.remove('red', 'factory');
                c.classList.add('green', 'tree');

                if (arrTree.length === 30) {
                    gameWon();
                }
            }
        }

        function randomFactory() {
            let g = Math.floor(Math.random() * 30);
            let val = boxes[g].dataset.value;

            if (!arrFactory.includes(val)) {
                arrFactory.push(val);
                boxes[g].classList.add('red', 'factory');
                boxes[g].classList.remove('green', 'tree');

                if (arrTree.includes(val)) {
                    arrTree.splice(arrTree.indexOf(val), 1);
                }

                if (arrFactory.length === 30) {
                    clearInterval(newFactory);
                    alert("The factories won... Refresh to try again.");
                }
            }
        }

        function gameWon() {
            clearInterval(newFactory);
            wonScreen.style.display = 'block';
        }

        function fireBurst(e) {
            const rect = e.target.getBoundingClientRect();
            new mojs.Burst({
                left: rect.left + (rect.width / 2),
                top: rect.top + (rect.height / 2),
                count: 9,
                radius: {40: 80},
                children: { fill: ['#9ff1a5', '#fff'] }
            }).play();
        }

        document.querySelector('.start-trigger').addEventListener('click', () => {
            initScreen.style.display = 'none';
            newFactory = setInterval(randomFactory, interval);
        });

        document.querySelector('.replay').addEventListener('click', () => {
            location.reload();
        });

        createGame();
    </script>
</body>
</html>
