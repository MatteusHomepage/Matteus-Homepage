<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New tab</title>
    <link rel="icon" type="image/x-icon" href="../googles.ico">
    <style>
        :root {
            --bg: #0f172a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --sidebar-width: 280px;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(0, 0, 0, 0.4) 100%);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 40px 24px;
            box-sizing: border-box; 
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            color: white;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-align: center;
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-group {
            width: 100%; 
        }

        .nav-btn {
            width: 100%; 
            box-sizing: border-box; 
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 16px 20px;
            margin-bottom: 14px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(8px);
        }

        .nav-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }

        .exit-link {
            margin-top: auto;
            text-decoration: none;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%; 
            box-sizing: border-box;
        }

        .exit-link:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            position: relative;
        }

        .game-header {
            padding: 30px 50px;
        }

        .game-header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            color: white;
        }

        .game-window {
            flex: 1;
            margin: 0 50px 50px 50px;
            background: #000;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo"></div>
    
    <div class="nav-group">
        <button class="nav-btn active" onclick="switchGame(this, 'Games/war.html')">The Last War</button>
        <button class="nav-btn" onclick="switchGame(this, 'Games/filling.html')">Beer Filling Game</button>
        <button class="nav-btn" onclick="switchGame(this, 'Games/tetris.html')">Tetris</button>
        <button class="nav-btn" onclick="switchGame(this, 'Games/TicTacDoom.html')">Tic Tac Toe</button>
        <button class="nav-btn" onclick="switchGame(this, 'Games/memory.html')">Memory Game</button>
    </div>

    <a href="../index.html" class="exit-link">← Back to Main Site</a>
</div>

<div class="main">
    <div class="game-header">
        <h2 id="current-title">The Last War</h2>
    </div>
    
    <div class="game-window">
        <iframe id="game-frame" src="Games/war.html"></iframe>
    </div>
</div>

<script>
    function switchGame(btn, file) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('current-title').innerText = btn.innerText;
        document.getElementById('game-frame').src = file;
    }
</script>

</body>
</html>
